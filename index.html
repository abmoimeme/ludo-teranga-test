// On opening the game, pick up anything saved from another device.
function pullAcct(force){
  if(!acct||!DB)return;
  dbx("GET","/accounts/"+acct.aid).then(function(d){
    if(d&&d.id&&d.fc){if(((d.t||0)>(acct.t||0)||force===true)&&!net){adoptAcct(d);acct.t=d.t;acct.name=d.name;saveAcct();if(g)renderAll()}}
    else if(EMAIL_ON){acct.t=0;saveAcct();pushAcct(true)}
    else if(acct.t)acctGone();
    else pushAcct(true);
  }).catch(function(e){if(e&&(e.status===401||e.status===403))acctOff=true});
}
// ---------- Email sign-in: create a login, sign in, bring an older account along ----------
var CCN=[["221","🇸🇳 Sénégal"],["1","🇺🇸 USA / Canada"],["33","🇫🇷 France"],["39","🇮🇹 Italia"],["other","🌍 …"]];
function emailOk(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)&&e.length<=120}
var MAIL_FIX={"gmial.com":"gmail.com","gmai.com":"gmail.com","gmail.co":"gmail.com","gmail.con":"gmail.com","gnail.com":"gmail.com","gmil.com":"gmail.com","gmail.cm":"gmail.com",
  "yaho.com":"yahoo.com","yahoo.co":"yahoo.com","yahoo.con":"yahoo.com","yaoo.com":"yahoo.com",
  "hotmial.com":"hotmail.com","hotmai.com":"hotmail.com","hotmail.co":"hotmail.com","hotmail.con":"hotmail.com",
  "outlok.com":"outlook.com","outlook.co":"outlook.com","outlool.com":"outlook.com",
  "icloud.co":"icloud.com","iclod.com":"icloud.com","icloud.con":"icloud.com"};
// Quietly fixes a handful of common typo'd email domains before we check the address.
function fixEmailTypo(e){
  var at=e.lastIndexOf("@");if(at<0)return e;
  var fixed=MAIL_FIX[e.slice(at+1)];
  return fixed?e.slice(0,at+1)+fixed:e;
}
function maskMail(e){var q=String(e||"").split("@");return q.length===2?q[0].slice(0,2)+"•••@"+q[1]:""}
function langOfCc(cc){return cc==="221"||cc==="33"?"fr":cc==="39"?"it":cc==="1"?"en":""}
function authMsg(e){
  var m=String((e&&e.message)||""),t=L();
  if(/EMAIL_EXISTS/.test(m))return t.emExists;
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m))return t.emBad;
  if(/WEAK_PASSWORD/.test(m))return t.emWeak;
  if(/INVALID_EMAIL|MISSING_EMAIL/.test(m))return t.emInvalid;
  if(/TOO_MANY_ATTEMPTS/.test(m))return t.emWait;
  if(/USER_DISABLED/.test(m))return t.emOff;
  if(/OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED|API key|API_KEY/i.test(m))return t.emSetup;
  return t.errNet;
}
function focusBad(id){var el=$(id);if(el){el.focus();el.classList.add("bad")}}
function emailSign(email,pw,create,cc){
  email=fixEmailTypo(String(email||"").trim().toLowerCase());pw=String(pw||"");
  onErr="";acctNote="";
  if(authBusy)return;
  authKind=create?"signup":"signin";
  if(!email){logEv(authKind+"_fail","no_email");onErr=L().emNoEmail;renderOnline();focusBad("em-mail");return}
  if(!emailOk(email)){logEv(authKind+"_fail","bad_email");onErr=L().emInvalid;renderOnline();focusBad("em-mail");return}
  if(!pw){logEv(authKind+"_fail","no_password");onErr=L().emNoPw;renderOnline();focusBad("em-pw");return}
  if(create&&pw.length<8){logEv("signup_fail","weak_password");onErr=L().emWeak;renderOnline();focusBad("em-pw");return}
  if(create&&!hasName()){logEv("signup_fail","no_name");onErr=L().emName;renderOnline();focusBad("me-name");return}
  logEv(authKind+"_try");
  authBusy=true;renderOnline();
  authCall(create?"accounts:signUp":"accounts:signInWithPassword",{email:email,password:pw,returnSecureToken:true}).then(function(j){
    pAuth={rt:j.refreshToken,uid:j.localId,email:email};savePAuth();
    pTok={t:j.idToken,exp:Date.now()+(parseInt(j.expiresIn,10)||3600)*1000-300000};
    if(create)authCall("accounts:sendOobCode",{requestType:"VERIFY_EMAIL",idToken:j.idToken}).catch(function(){});
    return afterAuth(cc);
  }).catch(function(e){
    logEv(authKind+"_fail",authCode(e));
    authBusy=false;onErr=e&&e.auth?authMsg(e):L().errNet;renderOnline();
  });
}
// Google sign-in: same shared afterAuth() flow as email, just a different way in.
function googleSign(idToken,cc){
  onErr="";acctNote="";
  if(authBusy||!idToken)return;
  authKind="google";
  logEv(authKind+"_try");
  authBusy=true;renderOnline();
  authCall("accounts:signInWithIdp",{postBody:"id_token="+encodeURIComponent(idToken)+"&providerId=google.com",requestUri:String(window.location.href),returnSecureToken:true}).then(function(j){
    pAuth={rt:j.refreshToken,uid:j.localId,email:j.email,ver:true};savePAuth();
    pTok={t:j.idToken,exp:Date.now()+(parseInt(j.expiresIn,10)||3600)*1000-300000};
    return afterAuth(cc);
  }).catch(function(e){
    logEv(authKind+"_fail",authCode(e));
    authBusy=false;onErr=L().googleFail;renderOnline();
  });
}
// After the sign-in service says yes: load this player's saved game, or bring an older one along, or start one.
function afterAuth(cc){
  var uid=pAuth.uid,hint=maskMail(pAuth.email);
  function done(){
    authBusy=false;autoLang(langOfCc(acct.cc));publishMe();openInbox();checkVerified();seenStart();renderOnline();syncGate();if(g)renderAll();
  }
  return dbx("GET","/accounts/"+uid).then(function(d){
    if(d&&d.id&&d.fc){
      acct={aid:uid,hint:hint,t:d.t||0,name:d.name,cc:String(d.cc||cc||guessCc()),mig:d.mig?1:0};saveAcct();
      adoptAcct(d);acctNote=L().welcomeBack(String(d.name||"").slice(0,12));setLegacy("");logEv(authKind+"_ok","saved_game_loaded");done();return;
    }
    // the database is not ready for logins yet: nothing is moved or removed, and the player stays as before
    function refused(e){
      pAuth=null;pTok=null;savePAuth();acct=null;saveAcct();authBusy=false;
      logEv(authKind+"_fail",e&&(e.status===401||e.status===403)?"save_refused":"network");
      onErr=e&&(e.status===401||e.status===403)?L().emSetup:L().errNet;renderOnline();syncGate();
    }
    var old=legacyAid?dbx("GET","/accounts/"+legacyAid).catch(function(){return null}):Promise.resolve(null);
    return old.then(function(o){
      if(o&&o.id&&o.fc){
        var was=legacyAid,nd=movedDoc(o,String(cc||guessCc()));
        return dbx("PUT","/accounts/"+uid,nd).then(function(){
          acct={aid:uid,hint:hint,t:nd.t,name:o.name,cc:nd.cc,mig:1};saveAcct();
          adoptAcct(nd);acctNote=L().movedOk;
          dbx("DELETE","/accounts/"+was).catch(function(){});setLegacy("");logEv(authKind+"_ok","old_game_moved");done();
        },refused);
      }
      if(!hasName()){logEv(authKind+"_fail","no_name");authBusy=false;onErr=L().emName;renderOnline();focusBad("me-name");return}
      acct={aid:uid,hint:hint,t:0,name:meName(),cc:String(cc||guessCc()),mig:0};
      var fd=acctDoc();
      return dbx("PUT","/accounts/"+uid,fd).then(function(){
        acct.t=fd.t;acct.b=baseOf(fd);saveAcct();acctNote=L().acctMade2;statAdd({"new":1});setLegacy("");logEv(authKind+"_ok","new_game");done();
      },refused);
    });
  });
}
// The older saved game, as it will be kept under the login.
function movedDoc(o,cc){
  return {id:o.id,fc:o.fc,name:String(o.name||"").slice(0,12),av:cleanAv(o.av,0),pts:typeof o.pts==="number"?o.pts:WELCOME,games:o.games||0,wins:o.wins||0,caps:o.caps||0,best:o.best||0,run:o.run||0,day:typeof o.day==="string"?o.day:"",
    friends:Array.isArray(o.friends)?o.friends.slice(0,40):[],cc:cc,mig:1,t:Date.now()};
}
function checkVerified(){
  if(!EMAIL_ON||!pAuth)return;
  var me=pAuth;
  tokenP().then(function(t){return t?authCall("accounts:lookup",{idToken:t}):null}).then(function(j){
    if(pAuth!==me||!j||!j.users||!j.users[0])return;
    var v=!!j.users[0].emailVerified;
    if(pAuth.ver!==v){if(v&&pAuth.ver===false)logEv("email_confirmed");pAuth.ver=v;savePAuth();if($("sheet-online").classList.contains("open")&&!net&&document.activeElement.tagName!=="INPUT")renderOnline()}
  }).catch(function(){});
}
function resendVerify(){
  tokenP().then(function(t){return authCall("accounts:sendOobCode",{requestType:"VERIFY_EMAIL",idToken:t})})
    .then(function(){acctNote=L().emSent;renderOnline()},function(e){onErr=e&&e.auth?authMsg(e):L().errNet;renderOnline()});

function resetPassword(email){
  email=fixEmailTypo(String(email||"").trim().toLowerCase());onErr="";acctNote="";
  if(!emailOk(email)){onErr=L().emResetNeed;renderOnline();focusBad("em-mail");return}
  logEv("reset_request");
  authCall("accounts:sendOobCode",{requestType:"PASSWORD_RESET",email:email})
    .then(function(){acctNote=L().emResetSent;renderOnline()},function(e){
      // the answer is the same whether or not the address has an account
      if(e&&e.auth&&/EMAIL_NOT_FOUND/.test(e.message)){acctNote=L().emResetSent}else onErr=e&&e.auth?authMsg(e):L().errNet;
      renderOnline();
    });
}
// A player who used a phone number before brings that saved game into the new login, once.
function claimPhone(cc,raw){
  var num=normPhone(cc,raw);onErr="";acctNote="";
  if(!acct||!pAuth||net||acct.mig)return;
  if(!num){onErr=L().errPhone;renderOnline();focusBad("mv-num");return}
  if(!window.crypto||!crypto.subtle){onErr=L().errNet;renderOnline();return}
  scramble(num).then(function(hex){
    return dbx("GET","/accounts/"+hex).then(function(o){
      if(!(o&&o.id&&o.fc)){logEv("old_game_not_found");onErr=L().moveNone;renderOnline();return}
      var oldFc=myFc,oldName=acct.name,aid=acct.aid,nd=movedDoc(o,acct.cc||"");
      return dbx("PUT","/accounts/"+aid,nd).then(function(){
        if(!acct||acct.aid!==aid)return;
        clearTimeout(acctT);
        if(oldName&&keyOf(oldName)!==keyOf(String(o.name||""))){delete bank.profiles[keyOf(oldName)];saveLocal()}
        adoptAcct(nd);acct.name=nd.name;acct.mig=1;acct.t=nd.t;saveAcct();
        dbx("DELETE","/accounts/"+hex).catch(function(){});
        if(oldFc!==myFc)dbx("DELETE","/players/"+oldFc).catch(function(){});
        logEv("old_game_moved","by_number");
        acctNote=L().movedOk;publishMe();renderOnline();if(g)renderAll();
      });
    });
  }).catch(function(e){onErr=e&&(e.status===401||e.status===403)?L().emSetup:L().errNet;renderOnline()});
}

  try{if(acct&&acct.name&&!((cfg.me&&cfg.me.name)||"").trim()){cfg.me=cfg.me||{};cfg.me.name=String(acct.name).slice(0,12)}}catch(e){}

  cfg.captureHome=false;
  if(typeof cfg.homeBonus!=="boolean")cfg.homeBonus=true;
  if(renamePlayer("Ndeye","Yama"))saveLocal();
  var saved=null;
  if(!saved){try{var s=localStorage.getItem("ludo-game3");if(s){var sj=JSON.parse(s);if(validGame(sj)&&!sj.over)saved=sj}}catch(e){}}
  if(saved){
    g=saved;renamePlayer("Ndeye","Yama");resumable=true;
    try{localStorage.setItem("ludo-cfg2",JSON.stringify(cfg))}catch(e){}
    epoch++;mount();
    if(g.over){phase="over";renderAll();showWin()}
    else if(g.dice&&g.dice.length){selDie=0;step()}
    else{g.dice=[];g.rolled=null;beginTurn()}
  }else{
    cfg.stake=0;startGame();
  }
  openLobby();
  var savedRoom="";
  try{savedRoom=localStorage.getItem("ludo-room")||""}catch(e){}
  if(DB&&savedRoom&&(!pendingCode||savedRoom===pendingCode)){
    // this phone was in an online game: go straight back to it and keep trying if the network is slow
    closeSheets();rejoining=true;openOnline();joinRoom(savedRoom);
  }else if(DB&&pendingCode){closeSheets();openOnline()}
  if(DB){
    openInbox();publishMe();pullAcct();checkVerified();seenStart();
    if(fcClean(pendingFriend).length===8&&!pendingCode){closeSheets();openOnline();addFriendByCode(pendingFriend)}
    // a link ending in ?stats opens the owner's statistics (the owner code is still needed)
    if(wantStats&&!savedRoom&&!pendingCode){closeSheets();openOwner();if(ownerOn)loadStats()}
    // a link ending in ?login opens the sign-in panel straight away
    var wantLogin=false;try{wantLogin=new URLSearchParams(location.search).has("login")}catch(e){}
    if(wantLogin&&!wantStats&&!savedRoom&&!pendingCode){closeSheets();openOnline()}
  }
}
