<!DOCTYPE html>
<html lang="en">
<head>

<style>

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

[hidden]{display:none!important}

<script>
(function(){

var $=function(id){return document.getElementById(id)},main=$("main");

function dur(sec){sec=Math.round(sec||0);if(sec<60)return sec+" s";if(sec<3600)return Math.round(sec/60)+" min";var h=Math.floor(sec/3600),m=Math.round((sec-h*3600)/60);if(m===60){h++;m=0}return h+" h "+("0"+m).slice(-2)}
function ago(t){if(!t)return "–";var s=(Date.now()-t)/1000;if(s<120)return "now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";if(s<86400*45)return Math.round(s/86400)+" d ago";return new Date(t).toISOString().slice(0,10)}

// ---------- sign-in: the owner account, shared with the owner tools inside the game ----------
var own=null,tok=null;
try{own=JSON.parse(localStorage.getItem("ludo-own-auth")||"null")}catch(e){}
if(!own||!own.rt||!own.key)own=null;
function saveOwn(){try{if(own)localStorage.setItem("ludo-own-auth",JSON.stringify(own));else localStorage.removeItem("ludo-own-auth")}catch(e){}}
function signInGoogle(idToken){
  return fetch(AUTH_URL+"/accounts:signInWithIdp?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({postBody:"id_token="+encodeURIComponent(idToken)+"&providerId=google.com",requestUri:String(window.location.href),returnSecureToken:true})})

      if(String(j.email||"").toLowerCase()!==OWNER_EMAIL){tok=null;own=null;saveOwn();throw new Error("This Google account is not the owner account.")}

    })});
}
function token(){
  if(!own)return Promise.reject(new Error("signin"));
  if(tok&&tok.exp>Date.now())return Promise.resolve(tok.t);
  return fetch(TOKEN_URL+"/token?key="+encodeURIComponent(own.key),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(own.rt)})
    .then(function(r){return r.json().then(function(j){
      if(!r.ok||!j.id_token){if(r.status===400||r.status===401||r.status===403){own=null;tok=null;saveOwn();throw new Error("signin")}throw new Error("net")}
      own.rt=j.refresh_token||own.rt;own.uid=j.user_id||own.uid;saveOwn();tok={t:j.id_token,exp:Date.now()+(parseInt(j.expires_in,10)||3600)*1000-60000};return tok.t;
    })});
}
function get(path,q){
  return token().then(function(t){return fetch(DB+path+".json?"+(q?q+"&":"")+"auth="+encodeURIComponent(t))}).then(function(r){if(!r.ok){var e=new Error("net");e.status=r.status;throw e}return r.json()});
}
function rulesText(){
  var o=String(own&&own.uid||"").replace(/[^A-Za-z0-9]/g,"");
  return '{"rules":{\n'+
  ' "rooms":{".read":"auth != null && auth.uid === \''+o+'\'","$code":{".read":true,".write":true,".validate":"$code.matches(/^[A-Z0-9]{6}$/)"}},\n'+
  ' "history":{".read":"auth != null && auth.uid === \''+o+'\'","$code":{".write":"!data.exists()",".validate":"$code.matches(/^[A-Z0-9]{6}$/) && newData.hasChildren([\'created\',\'ended\',\'cfg\',\'seats\'])"}},\n'+
  ' "players":{"$fc":{".read":true,".write":true,".validate":"$fc.matches(/^[A-Z0-9]{8}$/)"}},\n'+
  ' "inbox":{"$fc":{".read":true,".write":true,".validate":"$fc.matches(/^[A-Z0-9]{8}$/)"}},\n'+
  ' "accounts":{"$id":{".read":"$id.matches(/^[a-f0-9]{40}$/) || (auth != null && auth.uid === $id)",".write":"$id.matches(/^[a-f0-9]{40}$/) || (auth != null && auth.uid === $id)"}},\n'+
  ' "reports":{"$id":{".write":"!data.exists()"}},\n'+
  ' "events":{".read":"auth != null && auth.uid === \''+o+'\'","$d":{".write":"auth != null && auth.uid === \''+o+'\' && !newData.exists()","$k":{".write":"!data.exists()",".validate":"$d.matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/) && newData.hasChildren([\'e\',\'t\']) && newData.child(\'e\').isString() && newData.child(\'e\').val().length <= 24 && (!newData.child(\'r\').exists() || (newData.child(\'r\').isString() && newData.child(\'r\').val().length <= 60))"}}},\n'+
  ' "seen":{".read":"auth != null && auth.uid === \''+o+'\'","$u":{".read":"auth != null && auth.uid === $u",".write":"auth != null && auth.uid === $u"}},\n'+
  ' "stats":{"days":{".read":"auth != null && auth.uid === \''+o+'\'","$d":{"$s":{".write":true,".validate":"$d.matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/) && $s.matches(/^[a-z0-9]{10}$/)"}}}}}}';
}

// ---------- data ----------
var EV=[],SEEN={},STATS={},ROOMS={},HIST={},PUB={},denied={},loadedAt=0,loadErr="";
var F={range:7,cc:"",pf:"",b:""},tab="overview",pick="",find="",SP={who:"",by:"day",names:false};
function load(){
  loadErr="";denied={};
  var from=dayAgo(89);
  var a=get("/events",'orderBy=%22%24key%22&startAt=%22'+from+'%22').then(function(d){
    EV=[];Object.keys(d||{}).forEach(function(day){var rows=d[day]||{};Object.keys(rows).forEach(function(k){var r=rows[k];if(r&&typeof r==="object"&&typeof r.e==="string")EV.push({e:r.e,t:num(r.t),day:day,d:String(r.d||""),u:String(r.u||""),cc:CN[r.cc]?String(r.cc):"other",pf:r.pf==="app"?"app":"web",b:Math.floor(num(r.b)),r:String(r.r||""),l:String(r.l||""),dv:/^(mobile|tablet|desktop)$/.test(r.dv)?r.dv:"unknown",sp:String(r.sp||""),bn:String(r.bn||""),cp:String(r.cp||""),pl:String(r.pl||""),gm:String(r.gm||""),to:String(r.to||""),bot:r.bot?1:0,gco:String(r.gco||"").slice(0,40),gci:String(r.gci||"").slice(0,40)})})});
    EV.sort(function(x,y){return x.t-y.t});
  }).catch(function(e){if(e.status===401||e.status===403)denied.events=1;else throw e});
  var b=get("/seen").then(function(d){SEEN=d||{}}).catch(function(e){if(e.status===401||e.status===403)denied.seen=1;else throw e});
  var c=get("/stats/days",'orderBy=%22%24key%22&limitToLast=30').then(function(d){STATS=d||{}}).catch(function(e){if(e.status===401||e.status===403)denied.stats=1;else throw e});
  var d=get("/rooms").then(function(r){ROOMS=r||{}}).catch(function(e){if(e.status===401||e.status===403)denied.rooms=1;else throw e});
  var h=get("/history").then(function(r){HIST=r||{}}).catch(function(e){if(e.status===401||e.status===403)denied.history=1;else throw e});
  var pub=Promise.all([d,h]).then(function(){
    // Look up the @handle for any seated player (live room or finished game), by their public friend-code record (no extra rule needed: it's already readable by anyone).
    var fcs={};
    Object.keys(ROOMS||{}).forEach(function(code){var r=ROOMS[code];if(!r||!r.seats)return;Object.keys(r.seats).forEach(function(si){var s=r.seats[si];if(s&&s.fc&&!PUB[s.fc])fcs[s.fc]=1})});
    Object.keys(HIST||{}).forEach(function(code){var r=HIST[code];if(!r||!r.seats)return;Object.keys(r.seats).forEach(function(si){var s=r.seats[si];if(s&&s.fc&&!PUB[s.fc])fcs[s.fc]=1})});
    return Promise.all(Object.keys(fcs).map(function(fc){return get("/players/"+fc).then(function(p){PUB[fc]=p||null}).catch(function(){})}));
  });
  return Promise.all([a,b,c,d,h,pub]).then(function(){loadedAt=Date.now();prune();pruneEmptyRooms();pruneOldHistory()});
}
// Detailed events are kept 90 days.
function prune(){
  if(denied.events)return;
  var cut=dayAgo(90);
  get("/events","shallow=true").then(function(k){
    Object.keys(k||{}).filter(function(d){return /^\d{4}-\d\d-\d\d$/.test(d)&&d<cut}).forEach(function(d){
      token().then(function(t){fetch(DB+"/events/"+d+".json?auth="+encodeURIComponent(t),{method:"DELETE"}).catch(function(){})});
    });
  }).catch(function(){});
}
// Finished-game records are kept 90 days too, same as events.
function pruneOldHistory(){
  if(denied.history)return;
  var cut=dayAgo(90);
  Object.keys(HIST||{}).forEach(function(code){
    var h=HIST[code];
    if(!h||typeof h!=="object"||num(h.ended)>=Date.parse(cut+"T00:00:00Z"))return;
    delete HIST[code];
    token().then(function(t){fetch(DB+"/history/"+code+".json?auth="+encodeURIComponent(t),{method:"DELETE"}).catch(function(){})});
  });
}
// A lobby room that never got going (everyone left, or the creator just closed the tab) can be left
// behind forever with no players in it. Clear those out whenever the dashboard loads, so the "last
// rooms" list only shows games that actually went somewhere.
function pruneEmptyRooms(){
  if(denied.rooms)return;
  Object.keys(ROOMS||{}).forEach(function(code){
    var r=ROOMS[code];
    if(!r||typeof r!=="object"||r.status!=="lobby")return;
    var seats=r.seats||{},hasPlayer=Object.keys(seats).some(function(si){return seats[si]&&seats[si].id});
    if(hasPlayer)return;
    delete ROOMS[code];
    token().then(function(t){fetch(DB+"/rooms/"+code+".json?auth="+encodeURIComponent(t),{method:"DELETE"}).catch(function(){})});
  });
}
function fromDay(){return dayAgo(F.range-1)}
function evs(){var f=fromDay();return EV.filter(function(x){return x.day>=f&&(!F.cc||x.cc===F.cc)&&(!F.pf||x.pf===F.pf)&&(!F.b||String(x.b)===F.b)})}
function players(){
  var f=fromDay(),today=dayAgo(0),out=[];
  Object.keys(SEEN).forEach(function(k){
    var r=SEEN[k];if(!r||typeof r!=="object")return;
    var cc=CN[r.cc]?String(r.cc):"other",pf=r.pf==="app"?"app":"web",b=Math.floor(num(r.b));
    if((F.cc&&cc!==F.cc)||(F.pf&&pf!==F.pf)||(F.b&&String(b)!==F.b))return;
    var d=r.d&&typeof r.d==="object"?r.d:{},o={id:k,n:String(r.n||"").slice(0,12)||"(no name)",u:String(r.u||"").slice(0,20),cc:cc,pf:pf,b:b,first:num(r.first),last:num(r.last),ses:Math.floor(num(r.ses)),sec:num(r.sec),g:Math.floor(num(r.g)),w:Math.floor(num(r.w)),d:d,in:0,days:0,today:num(d[today])};
    Object.keys(d).forEach(function(day){if(day>=f&&num(d[day])){o.in+=num(d[day]);o.days++}});
    out.push(o);
  });
  return out.sort(function(a,b){return b.last-a.last});
}
function count(list,e,r){var n=0;list.forEach(function(x){if(x.e===e&&(r===undefined||x.r===r))n++});return n}
function login(list){
  var L={su_ok:count(list,"signup_ok"),su_fail:count(list,"signup_fail"),si_ok:count(list,"signin_ok"),si_fail:count(list,"signin_fail"),reasons:{},dist:[0,0,0,0],never:0,resets:count(list,"reset_request"),conf:count(list,"email_confirmed"),out:count(list,"signed_out"),ref:count(list,"save_refused"),merged:count(list,"save_merged"),moved:count(list,"old_game_moved"),nomove:count(list,"old_game_not_found"),del:count(list,"account_deleted"),opens:count(list,"app_open"),errs:count(list,"js_error")};
  var per={};
  list.forEach(function(x){
    var k=x.e.split("_")[0],res=x.e.slice(x.e.indexOf("_")+1);
    if(k!=="signup"&&k!=="signin")return;
    if(res==="fail"){var key=x.r||"unknown";L.reasons[key]=L.reasons[key]||{su:0,si:0};L.reasons[key][k==="signup"?"su":"si"]++}
    if(!x.d)return;per[x.d]=per[x.d]||{f:0,ok:0};
    if(res==="fail")per[x.d].f++;
    else if(res==="ok"){L.dist[Math.min(per[x.d].f,3)]++;per[x.d].f=0;per[x.d].ok++}
  });
  Object.keys(per).forEach(function(d){if(per[d].f>0&&!per[d].ok)L.never++});
  L.devices=Object.keys(per).length;
  return L;
}
var WHY={
  wrong_email_or_password:["Wrong email or password, or no login with that email.","Normal in small numbers. If high, make “Forgot your password” and “Create my login” easier to spot."],

function csv(){
  var rows,name="events";
  if(tab==="players"){
    name="players";rows=[["player","username","country","platform","build","first_seen_utc","last_seen_utc","sessions","total_seconds","seconds_in_period","days_active_in_period","games","wins"]];

  }else if(tab==="sponsors"){
    name="sponsors";var Z=sponsorData();
    rows=[["sponsor","banner_views","unique_viewers","clicks","unique_clickers","click_through_rate_percent","sponsor_website_visits","conversions"]];
    Z.keys.forEach(function(k){var o=Z.S[k];rows.push([SPN[k]||k,o.v,Object.keys(o.viewers).length,o.c,Object.keys(o.clickers).length,o.v?(o.c*100/o.v).toFixed(2):"",o.visits,""])});
    rows.push([]);rows.push(["click_time_utc","player_or_visitor_id","sponsor","banner","campaign","placement","game","destination","country","device","status"]);
    Z.clicks.forEach(function(x){rows.push([new Date(x.t).toISOString(),pid(x),SPN[x.mk]||x.mk,x.bn,x.cp,PLN[x.plc]||x.plc,x.gm,x.to,x.cc,x.dv,x.st])});
  }else{
    rows=[["time_utc","event","reason","country","platform","build","player","device"]];
    evs().forEach(function(x){rows.push([new Date(x.t).toISOString(),x.e,x.r,x.cc,x.pf,x.b,x.u&&SEEN[x.u]?String(SEEN[x.u].n||""):"",x.d])});
  }
  var txt=rows.map(function(r){return r.map(function(c){c=String(c==null?"":c);if(/^[=+\-@]/.test(c))c="'"+c;return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="ludo-teranga-"+name+"-"+dayAgo(0)+".csv";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);

function renderSign(msg){
  $("signout").hidden=true;$("refresh").hidden=true;$("when").textContent="";
  if(!DB||!KEY){main.innerHTML='<div class="sign"><h2>Not set up</h2><p style="margin:0">This copy of the game has no database or sign-in key in config.js.</p></div>';return}
  main.innerHTML='<div class="sign"><h2>Owner sign-in</h2><p style="margin:0 0 14px;color:var(--ink2)">Use the owner\'s Google account. The database lets only that account read these numbers.</p><div id="gbtn"></div>'+(msg?'<p class="err" role="alert">'+esc(msg)+'</p>':"")+'</div>';
  mountGoogleButton();
}
function mountGoogleButton(){
  var el=$("gbtn");if(!el)return;
  var tries=0;
  (function tick(){
    if(window.google&&window.google.accounts&&window.google.accounts.id){
      google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogleCredential});
      google.accounts.id.renderButton(el,{theme:"outline",size:"large",text:"signin_with",width:280});
      return;
    }
    if(++tries>40){el.innerHTML='<p class="err" role="alert">Could not load Google sign-in. Check your connection and reload.</p>';return}
    setTimeout(tick,150);
  })();
}
window.onGoogleCredential=function(resp){
  var el=$("gbtn");if(el)el.innerHTML='<p style="color:var(--ink2);margin:0">Signing in…</p>';
  signInGoogle(resp&&resp.credential).then(start,function(er){renderSign(er.message||"Sign-in failed.")});
};
function start(){
  main.innerHTML='<p style="color:var(--ink2)">Loading…</p>';
  load().then(render,function(e){
    if(e&&e.message==="signin"){renderSign("Please sign in again.");return}
    loadErr="Could not reach the game server. Check your connection and tap Refresh.";loadedAt=0;render();
  });
  armPoll();
}
// Keep the numbers current on their own: re-load once a minute while this tab is open and the owner
// is signed in. Paused while the tab isn't visible, so it doesn't poll in the background forever.
var pollT=null;
function armPoll(){
  clearInterval(pollT);
  pollT=setInterval(function(){if(own&&!document.hidden)start()},60000);
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&own&&loadedAt&&Date.now()-loadedAt>=60000)start()});

})();
