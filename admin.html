<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard · Ludo Teranga</title>
<meta name="author" content="Nioro Resources LLC">
<meta name="theme-color" content="#121938">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
@font-face{font-family:"Baloo 2";font-weight:800;font-display:swap;src:url(fonts/baloo2-800.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-400.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-600.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(fonts/figtree-700.woff2) format("woff2")}
:root{--ink:#121938;--ink2:#4a5278;--paper:#f4f1e8;--card:#fff;--line:#e3dfd2;--gold:#f0bf00;--good:#1f8a55;--bad:#c8402a;--warn:#b97a00;--blue:#2f5fd0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Baloo 2",Figtree,sans-serif;font-weight:800;margin:0;line-height:1.1}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{background:var(--ink);color:#f3f0e6;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top h1{font-size:1.5rem}.top h1 span{color:var(--gold)}
.top .tag{font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#aab2da}
.top .sp{flex:1}
.top button{background:none;border:1.5px solid #5a6294;color:#f3f0e6;border-radius:999px;padding:6px 14px;font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:#e7e2d3;border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:700;color:var(--ink2)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(18,25,56,.14)}
select{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600}
.sp{flex:1}
.btn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi small{display:block;font-weight:700;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.kpi b{display:block;font-family:"Baloo 2";font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--ink2)}
.kpi.good b{color:var(--good)}.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;min-width:0}
.card h2{font-size:1.15rem;margin-bottom:10px}
.card p.note{color:var(--ink2);font-size:.85rem;margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .card{margin-top:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
td.wrapc{white-space:normal;text-align:left;color:var(--ink2);font-size:.85rem}
.scroll{overflow-x:auto}
tr.pick{cursor:pointer}tr.pick:hover{background:#faf7ee}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-weight:700;font-size:.75rem}
.pill.good{background:#dff3e8;color:var(--good)}.pill.bad{background:#fbe3dd;color:var(--bad)}.pill.warn{background:#fff0cc;color:var(--warn)}.pill.info{background:#e4eaf9;color:var(--blue)}
.attn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.attn li{display:flex;gap:10px;align-items:flex-start}
.attn .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--bad)}
.attn .dot.warn{background:var(--warn)}.attn .dot.good{background:var(--good)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font:600 10px Figtree,sans-serif;fill:var(--ink2)}
.sign{max-width:400px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.sign h2{font-size:1.4rem;margin-bottom:6px}
.sign input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:10px;background:#fff}
.sign .btn{width:100%;margin-top:14px;padding:12px}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
textarea{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fbfaf5;color:var(--ink)}
footer{color:var(--ink2);font-size:.8rem;margin-top:26px}
[hidden]{display:none!important}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.wrap{padding:14px 12px 50px}.top{padding:12px}}
</style>
</head>
<body>
<header class="top">
  <h1>Ludo <span>Teranga</span></h1><span class="tag">Dashboard</span><span class="sp"></span>
  <span id="when" class="tag"></span>
  <button type="button" id="refresh" hidden>Refresh</button>
  <button type="button" id="signout" hidden>Sign out</button>
</header>
<main class="wrap" id="main"></main>
<script src="config.js"></script>
<script>
(function(){
"use strict";
var CFG=window.LUDO_CONFIG||{},DB=String(CFG.databaseURL||"").replace(/\/+$/,""),KEY=String(CFG.apiKey||"");
var AUTH_URL=(CFG.authUrl||"https://identitytoolkit.googleapis.com/v1").replace(/\/+$/,""),TOKEN_URL=(CFG.tokenUrl||"https://securetoken.googleapis.com/v1").replace(/\/+$/,"");
var $=function(id){return document.getElementById(id)},main=$("main");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n||0).toLocaleString("en-US")}
function num(x){return typeof x==="number"&&x>0&&x<1e13?x:0}
function pct(a,b){return b?Math.round(a*100/b)+" %":"–"}
function dur(sec){sec=Math.round(sec||0);if(sec<60)return sec+" s";if(sec<3600)return Math.round(sec/60)+" min";var h=Math.floor(sec/3600),m=Math.round((sec-h*3600)/60);if(m===60){h++;m=0}return h+" h "+("0"+m).slice(-2)}
function ago(t){if(!t)return "–";var s=(Date.now()-t)/1000;if(s<120)return "now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";if(s<86400*45)return Math.round(s/86400)+" d ago";return new Date(t).toISOString().slice(0,10)}
function dayOf(t){return new Date(t).toISOString().slice(0,10)}
function dayAgo(n){return dayOf(Date.now()-n*86400000)}
function stamp(t){var d=new Date(t);return d.toISOString().slice(5,10)+" "+d.toISOString().slice(11,16)}
var CN={"221":"🇸🇳 Senegal","1":"🇺🇸 USA / Canada","33":"🇫🇷 France","39":"🇮🇹 Italy","other":"🌍 Other"};
function flag(cc){return (CN[cc]||CN.other).split(" ")[0]}

// ---------- sign-in: the owner account, shared with the owner tools inside the game ----------
var own=null,tok=null;
try{own=JSON.parse(localStorage.getItem("ludo-own-auth")||"null")}catch(e){}
if(!own||!own.rt||!own.key)own=null;
function saveOwn(){try{if(own)localStorage.setItem("ludo-own-auth",JSON.stringify(own));else localStorage.removeItem("ludo-own-auth")}catch(e){}}
function signIn(email,pw){
  return fetch(AUTH_URL+"/accounts:signInWithPassword?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:String(email||"").trim(),password:String(pw||""),returnSecureToken:true})})
    .then(function(r){return r.json().then(function(j){
      if(!r.ok||!j.idToken){var m=String((j&&j.error&&j.error.message)||"");throw new Error(/INVALID|NOT_FOUND|MISSING/.test(m)?"Email or password not recognised.":/TOO_MANY/.test(m)?"Too many attempts. Wait a few minutes.":"Sign-in is not available right now.")}
      own={key:KEY,rt:j.refreshToken,uid:j.localId};saveOwn();tok={t:j.idToken,exp:Date.now()+(parseInt(j.expiresIn,10)||3600)*1000-60000};
    })});
}
function token(){
  if(!own)return Promise.reject(new Error("signin"));
  if(tok&&tok.exp>Date.now())return Promise.resolve(tok.t);
  return fetch(TOKEN_URL+"/token?key="+encodeURIComponent(own.key),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(own.rt)})
    .then(function(r){return r.json().then(function(j){
      if(!r.ok||!j.id_token){if(r.status===400||r.status===401||r.status===403){own=null;tok=null;saveOwn();throw new Error("signin")}throw new Error("net")}
      own.rt=j.refresh_token||own.rt;own.uid=j.user_id||own.uid;saveOwn();tok={t:j.id_token,exp:Date.now()+(parseInt(j.expires_in,10)||3600)*1000-60000};return tok.t;
    })});
}
function get(path,q){
  return token().then(function(t){return fetch(DB+path+".json?"+(q?q+"&":"")+"auth="+encodeURIComponent(t))}).then(function(r){if(!r.ok){var e=new Error("net");e.status=r.status;throw e}return r.json()});
}
function rulesText(){
  var o=String(own&&own.uid||"").replace(/[^A-Za-z0-9]/g,"");
  return '{"rules":{\n'+
  ' "rooms":{"$code":{".read":true,".write":true,".validate":"$code.matches(/^[A-Z0-9]{6}$/)"}},\n'+
  ' "players":{"$fc":{".read":true,".write":true,".validate":"$fc.matches(/^[A-Z0-9]{8}$/)"}},\n'+
  ' "inbox":{"$fc":{".read":true,".write":true,".validate":"$fc.matches(/^[A-Z0-9]{8}$/)"}},\n'+
  ' "accounts":{"$id":{".read":"$id.matches(/^[a-f0-9]{40}$/) || (auth != null && auth.uid === $id)",".write":"$id.matches(/^[a-f0-9]{40}$/) || (auth != null && auth.uid === $id)"}},\n'+
  ' "reports":{"$id":{".write":"!data.exists()"}},\n'+
  ' "events":{".read":"auth != null && auth.uid === \''+o+'\'","$d":{".write":"auth != null && auth.uid === \''+o+'\' && !newData.exists()","$k":{".write":"!data.exists()",".validate":"$d.matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/) && newData.hasChildren([\'e\',\'t\']) && newData.child(\'e\').isString() && newData.child(\'e\').val().length <= 24 && (!newData.child(\'r\').exists() || (newData.child(\'r\').isString() && newData.child(\'r\').val().length <= 60))"}}},\n'+
  ' "seen":{".read":"auth != null && auth.uid === \''+o+'\'","$u":{".read":"auth != null && auth.uid === $u",".write":"auth != null && auth.uid === $u"}},\n'+
  ' "stats":{"days":{".read":"auth != null && auth.uid === \''+o+'\'","$d":{"$s":{".write":true,".validate":"$d.matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/) && $s.matches(/^[a-z0-9]{10}$/)"}}}}}}';
}

// ---------- data ----------
var EV=[],SEEN={},STATS={},denied={},loadedAt=0,loadErr="";
var F={range:7,cc:"",pf:"",b:""},tab="overview",pick="";
function load(){
  loadErr="";denied={};
  var from=dayAgo(29);
  var a=get("/events",'orderBy=%22%24key%22&startAt=%22'+from+'%22').then(function(d){
    EV=[];Object.keys(d||{}).forEach(function(day){var rows=d[day]||{};Object.keys(rows).forEach(function(k){var r=rows[k];if(r&&typeof r==="object"&&typeof r.e==="string")EV.push({e:r.e,t:num(r.t),day:day,d:String(r.d||""),u:String(r.u||""),cc:CN[r.cc]?String(r.cc):"other",pf:r.pf==="app"?"app":"web",b:Math.floor(num(r.b)),r:String(r.r||"")})})});
    EV.sort(function(x,y){return x.t-y.t});
  }).catch(function(e){if(e.status===401||e.status===403)denied.events=1;else throw e});
  var b=get("/seen").then(function(d){SEEN=d||{}}).catch(function(e){if(e.status===401||e.status===403)denied.seen=1;else throw e});
  var c=get("/stats/days",'orderBy=%22%24key%22&limitToLast=30').then(function(d){STATS=d||{}}).catch(function(e){if(e.status===401||e.status===403)denied.stats=1;else throw e});
  return Promise.all([a,b,c]).then(function(){loadedAt=Date.now();prune()});
}
// Detailed events are kept 90 days.
function prune(){
  if(denied.events)return;
  var cut=dayAgo(90);
  get("/events","shallow=true").then(function(k){
    Object.keys(k||{}).filter(function(d){return /^\d{4}-\d\d-\d\d$/.test(d)&&d<cut}).forEach(function(d){
      token().then(function(t){fetch(DB+"/events/"+d+".json?auth="+encodeURIComponent(t),{method:"DELETE"}).catch(function(){})});
    });
  }).catch(function(){});
}
function fromDay(){return dayAgo(F.range-1)}
function evs(){var f=fromDay();return EV.filter(function(x){return x.day>=f&&(!F.cc||x.cc===F.cc)&&(!F.pf||x.pf===F.pf)&&(!F.b||String(x.b)===F.b)})}
function players(){
  var f=fromDay(),today=dayAgo(0),out=[];
  Object.keys(SEEN).forEach(function(k){
    var r=SEEN[k];if(!r||typeof r!=="object")return;
    var cc=CN[r.cc]?String(r.cc):"other",pf=r.pf==="app"?"app":"web",b=Math.floor(num(r.b));
    if((F.cc&&cc!==F.cc)||(F.pf&&pf!==F.pf)||(F.b&&String(b)!==F.b))return;
    var d=r.d&&typeof r.d==="object"?r.d:{},o={id:k,n:String(r.n||"").slice(0,12)||"(no name)",cc:cc,pf:pf,b:b,first:num(r.first),last:num(r.last),ses:Math.floor(num(r.ses)),sec:num(r.sec),g:Math.floor(num(r.g)),w:Math.floor(num(r.w)),d:d,in:0,days:0,today:num(d[today])};
    Object.keys(d).forEach(function(day){if(day>=f&&num(d[day])){o.in+=num(d[day]);o.days++}});
    out.push(o);
  });
  return out.sort(function(a,b){return b.last-a.last});
}
function count(list,e,r){var n=0;list.forEach(function(x){if(x.e===e&&(r===undefined||x.r===r))n++});return n}
function login(list){
  var L={su_ok:count(list,"signup_ok"),su_fail:count(list,"signup_fail"),si_ok:count(list,"signin_ok"),si_fail:count(list,"signin_fail"),reasons:{},dist:[0,0,0,0],never:0,resets:count(list,"reset_request"),conf:count(list,"email_confirmed"),out:count(list,"signed_out"),ref:count(list,"save_refused"),merged:count(list,"save_merged"),moved:count(list,"old_game_moved"),nomove:count(list,"old_game_not_found"),del:count(list,"account_deleted"),opens:count(list,"app_open"),errs:count(list,"js_error")};
  var per={};
  list.forEach(function(x){
    var k=x.e.split("_")[0],res=x.e.slice(x.e.indexOf("_")+1);
    if(k!=="signup"&&k!=="signin")return;
    if(res==="fail"){var key=x.r||"unknown";L.reasons[key]=L.reasons[key]||{su:0,si:0};L.reasons[key][k==="signup"?"su":"si"]++}
    if(!x.d)return;per[x.d]=per[x.d]||{f:0,ok:0};
    if(res==="fail")per[x.d].f++;
    else if(res==="ok"){L.dist[Math.min(per[x.d].f,3)]++;per[x.d].f=0;per[x.d].ok++}
  });
  Object.keys(per).forEach(function(d){if(per[d].f>0&&!per[d].ok)L.never++});
  L.devices=Object.keys(per).length;
  return L;
}
var WHY={
  wrong_email_or_password:["Wrong email or password, or no login with that email.","Normal in small numbers. If high, make “Forgot your password” and “Create my login” easier to spot."],
  email_exists:["Tried to create a login with an email that already has one.","The player should tap Sign in. If frequent, show Sign in first for returning players."],
  weak_password:["Password shorter than 8 characters.","Normal. The hint is already in the password box."],
  bad_email:["The email address was mistyped.","Normal in small numbers."],
  no_password:["Tapped the button with the password box empty.","Normal in small numbers."],
  no_name:["Tried to create a login before typing a name.","If frequent, ask for the name after the login instead of before."],
  too_many_attempts:["The sign-in service blocked repeated tries for a few minutes.","Usually one player retrying a wrong password. Check that player's timeline."],
  login_disabled:["The login was disabled in Firebase.","Check Firebase > Authentication > Users."],
  service_not_ready:["Email sign-in is switched off, or the key is wrong.","Urgent. Check Firebase > Authentication > Sign-in method and config.js."],
  save_refused:["Sign-in worked, but the database refused to save the game.","Urgent. The database rules do not match this build. Republish the rules."],
  network:["No connection, or the service could not be reached.","Normal in small numbers. If high in one country, check hosting from there."],
  service_other:["The sign-in service answered with an unexpected error.","Look at the player timeline, then at the Firebase status page."]
};
function label(e){return ({signup_ok:"Login created",signup_fail:"Create login failed",signup_try:"Create login tried",signin_ok:"Signed in",signin_fail:"Sign-in failed",signin_try:"Sign-in tried",reset_request:"Password reset asked",email_confirmed:"Email confirmed",signed_out:"Signed out by the game",save_refused:"Save refused",save_merged:"Newer save taken",old_game_moved:"Phone-number game moved",old_game_not_found:"Phone-number game not found",account_deleted:"Account deleted",app_open:"Opened the game",js_error:"Error",name_set:"Typed a name",game_start:"Game started",game_end:"Game finished",game_left:"Game left"})[e]||e}
function tone(e){return /fail|refused|signed_out|js_error/.test(e)?"bad":/_ok|confirmed|moved$|game_end/.test(e)?"good":/not_found|merged|reset|game_left/.test(e)?"warn":"info"}

// ---------- charts ----------
function bars(days,series,h){
  h=h||150;var W=Math.max(days.length*26,300),max=1;
  days.forEach(function(d,i){var s=0;series.forEach(function(se){s+=se.v[i]||0});if(s>max)max=s});
  var bw=W/days.length,o='<div class="scroll"><svg viewBox="0 0 '+W+' '+(h+26)+'" width="100%" style="min-width:'+Math.min(W,620)+'px;max-height:'+(h+60)+'px" role="img" aria-label="Daily chart">';
  o+='<line x1="0" y1="'+h+'" x2="'+W+'" y2="'+h+'" stroke="#e3dfd2"/><text x="2" y="10">'+fmt(max)+'</text>';
  days.forEach(function(d,i){
    var y=h,x=i*bw+bw*0.18,w=bw*0.64;
    series.forEach(function(se){var v=se.v[i]||0,bh=v/max*(h-16);if(v){y-=bh;o+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+se.c+'"><title>'+d+' · '+se.n+': '+fmt(v)+'</title></rect>'}});
    if(days.length<=10||i%Math.ceil(days.length/10)===0||i===days.length-1)o+='<text x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(h+16)+'" text-anchor="middle">'+d.slice(5)+'</text>';
  });
  o+='</svg></div><div class="legend">'+series.map(function(se){return '<span><i style="background:'+se.c+'"></i>'+se.n+'</span>'}).join("")+'</div>';
  return o;
}
function dayList(){var n=Math.max(F.range,7),a=[];for(var i=n-1;i>=0;i--)a.push(dayAgo(i));return a}

// ---------- views ----------
function kpi(l,v,sub,cls){return '<div class="kpi '+(cls||"")+'"><small>'+l+'</small><b>'+v+'</b>'+(sub?'<span>'+sub+'</span>':"")+'</div>'}
function rangeWord(){return F.range===1?"today":"last "+F.range+" days"}
function attention(L,P){
  var a=[],tot=L.si_ok+L.si_fail,sut=L.su_ok+L.su_fail;
  if(denied.events)a.push(["bad","The event log is not switched on in the database. See the notice below."]);
  if(L.ref)a.push(["bad",fmt(L.ref)+" refused save"+(L.ref>1?"s":"")+": players' points are not reaching the database. Check the rules."]);
  if(L.reasons.save_refused||L.reasons.service_not_ready)a.push(["bad","Sign-in is failing for a set-up reason, not a player mistake. Open Login health."]);
  if(L.out)a.push(["warn",fmt(L.out)+" player"+(L.out>1?"s were":" was")+" signed out by the game. Expected only after a password change or a deleted login."]);
  if(tot>=10&&L.si_fail/tot>0.25)a.push(["warn","Sign-in fails "+pct(L.si_fail,tot)+" of the time ("+rangeWord()+")."]);
  if(sut>=10&&L.su_fail/sut>0.4)a.push(["warn","Creating a login fails "+pct(L.su_fail,sut)+" of the time ("+rangeWord()+")."]);

    '<select id="f-pf" aria-label="Web or app"><option value="">Web and app</option><option value="web"'+(F.pf==="web"?" selected":"")+'>Web</option><option value="app"'+(F.pf==="app"?" selected":"")+'>App</option></select>'+
    '<select id="f-b" aria-label="Build"><option value="">All builds</option>'+builds().map(function(b){return '<option value="'+b+'"'+(F.b===b?" selected":"")+'>v'+b+'</option>'}).join("")+'</select>'+
    '<button type="button" class="btn" id="csv">Export CSV</button></div>';
  if(loadErr)h+='<div class="card" style="margin-top:0;border-color:var(--bad)"><p class="err" style="margin:0">'+esc(loadErr)+'</p></div>';
  h+=notice();
  h+=tab==="login"?vLogin():tab==="players"?vPlayers():tab==="errors"?vErrors():tab==="steps"?vSteps():tab==="games"?vGames():vOverview();
  h+='<footer>Times and days follow universal time (UTC). Detailed events are kept 90 days. No email address, password or phone number is stored in this data. &copy; 2026 Nioro Resources LLC</footer>';
  main.innerHTML=h;
  Array.prototype.forEach.call(main.querySelectorAll("[data-tab]"),function(b){b.addEventListener("click",function(){tab=b.getAttribute("data-tab");render()})});
  $("f-range").addEventListener("change",function(){F.range=parseInt(this.value,10)||7;render()});
  $("f-cc").addEventListener("change",function(){F.cc=this.value;render()});
  $("f-pf").addEventListener("change",function(){F.pf=this.value;render()});
  $("f-b").addEventListener("change",function(){F.b=this.value;render()});
  $("csv").addEventListener("click",csv);
  if($("copy"))$("copy").addEventListener("click",function(){var t=$("rules");t.select();try{navigator.clipboard.writeText(t.value).then(function(){$("copied").textContent="Copied."},function(){document.execCommand("copy");$("copied").textContent="Copied."})}catch(e){try{document.execCommand("copy");$("copied").textContent="Copied."}catch(x){}}});
  Array.prototype.forEach.call(main.querySelectorAll("tr.pick"),function(r){var go=function(){pick=r.getAttribute("data-u");render();var t=$("timeline");if(t&&t.scrollIntoView)t.scrollIntoView({block:"nearest"})};r.addEventListener("click",go);r.addEventListener("keydown",function(e){if(e.key==="Enter")go()})});
}
function csv(){
  var rows=[["time_utc","event","reason","country","platform","build","player","device"]];
  evs().forEach(function(x){rows.push([new Date(x.t).toISOString(),x.e,x.r,x.cc,x.pf,x.b,x.u&&SEEN[x.u]?String(SEEN[x.u].n||""):"",x.d])});
  var txt=rows.map(function(r){return r.map(function(c){c=String(c==null?"":c);if(/^[=+\-@]/.test(c))c="'"+c;return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="ludo-teranga-events-"+dayAgo(0)+".csv";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
function renderSign(msg){
  $("signout").hidden=true;$("refresh").hidden=true;$("when").textContent="";
  if(!DB||!KEY){main.innerHTML='<div class="sign"><h2>Not set up</h2><p style="margin:0">This copy of the game has no database or sign-in key in config.js.</p></div>';return}
  main.innerHTML='<form class="sign" id="form"><h2>Owner sign-in</h2><p style="margin:0;color:var(--ink2)">Use the owner account. The database lets only that account read these numbers.</p><input type="email" id="mail" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Owner email" aria-label="Owner email" required><input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button type="submit" class="btn gold" id="go">Sign in</button>'+(msg?'<p class="err" role="alert">'+esc(msg)+'</p>':"")+'</form>';
  $("form").addEventListener("submit",function(e){
    e.preventDefault();$("go").disabled=true;
    signIn($("mail").value,$("pw").value).then(start,function(er){renderSign(er.message||"Sign-in failed.")});
  });
}
function start(){
  main.innerHTML='<p style="color:var(--ink2)">Loading…</p>';
  load().then(render,function(e){
    if(e&&e.message==="signin"){renderSign("Please sign in again.");return}
    loadErr="Could not reach the game server. Check your connection and tap Refresh.";loadedAt=0;render();
  });
}
$("signout").addEventListener("click",function(){own=null;tok=null;saveOwn();EV=[];SEEN={};STATS={};renderSign("")});
$("refresh").addEventListener("click",start);
if(own)start();else renderSign("");
})();
</script>
</body>
</html>
